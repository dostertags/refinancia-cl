name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov-fail-under=80
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run build
      - run: |
          (cd backend && uvicorn app.main:app --port 8000 &) 
          (cd frontend && npx next start -p 3000 &)
          sleep 8
          cd frontend && npm run e2e
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend
  # Despliegue (Railway/Fly.io): se agrega con secretos del repo una vez elegido el proveedor.
  # Ver README > Despliegue. Ejemplo Fly.io: superfly/flyctl-actions con FLY_API_TOKEN.
  # Scrape diario del comparador SERNAC:
  # on: schedule: [{cron: "0 7 * * *"}]  -> curl -X POST $API/api/admin/scrape -H "X-Admin-Token: $ADMIN_TOKEN"
