# Desarrollo local: docker compose up --build
# Ya no hay base de datos ni Redis: los datos de mercado son un archivo JSON público (simulaciones del SERNAC) y no se guarda nada del usuario.
services:
  api:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_URL: http://localhost:3000
      FORCE_HTTPS: "0"  # 1 en producción detrás de TLS
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports: ["8000:8000"]
  web:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]
